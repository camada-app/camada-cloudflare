name: ci
on: [push, pull_request]
jobs:
  test:
    if: github.repository == 'camada-app/camada-cloudflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run check
      - run: npm test
