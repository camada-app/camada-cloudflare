name: Update Camada
on: workflow_dispatch
permissions:
  contents: write
jobs:
  update:
    if: github.repository != 'camada-app/camada-cloudflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Replace src/ with the latest Camada release
        run: |
          set -euo pipefail
          upstream=https://github.com/camada-app/camada-cloudflare
          tag=$(git ls-remote --tags --refs --sort=-v:refname "$upstream" 'v*' \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+' | grep -v -- '-' | head -n1 || true)
          if [ -z "$tag" ]; then
            echo "::error::Camada has not published a release yet"
            exit 1
          fi
          git fetch --depth=1 "$upstream" "refs/tags/$tag"
          git rm -r -q --ignore-unmatch src
          git checkout FETCH_HEAD -- src
          if git diff --cached --quiet; then
            echo "Already up to date with $tag"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update Camada Worker to $tag"
          git push
          echo "Pushed $tag. Cloudflare redeploys the Worker from this push."
